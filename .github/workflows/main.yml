name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Aceptar licencias
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Corregir import faltante
        run: |
          F=$(find . -name BluetoothScreen.kt | head -1)
          grep -q "androidx.compose.ui.draw.clip" "$F" || sed -i '/^import androidx.compose.foundation.shape.RoundedCornerShape/a import androidx.compose.ui.draw.clip' "$F"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Compilar
        run: |
          D=$(dirname "$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)")
          echo "Proyecto en: $D"
          cd "$D"
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: RobotFootball-APK
          path: "**/app-debug.apk"
